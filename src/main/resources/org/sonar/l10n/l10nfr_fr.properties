property.sonar.auth.gitlab.allowAllGroups.description=Une fois activé avec l\u2019approvisionnement automatique, tout groupe visible par le jeton d\u2019approvisionnement est approvisionné, et la liste des groupes autorisés est ignorée. Sans effet avec l\u2019approvisionnement à la volée. Risque de sécurité : tout compte appartenant à un groupe accessible au jeton d\u2019approvisionnement se verra accorder l\u2019accès. Restreindre par la liste des groupes autorisés, sauf si un accès large est délibéré. Non pris en charge sur GitLab.com (SaaS) : le réglage est ignoré lorsque l\u2019URL configurée est gitlab.com, le jeton d\u2019approvisionnement pouvant voir un ensemble de groupes bien plus vaste et non borné. Note de performance : la connexion peut être plus lente pour les comptes appartenant à de nombreux groupes, tous leurs groupes devant être récupérés depuis GitLab à chaque authentification.
property.sonar.auth.gitlab.allowAllGroups.name=Autoriser tous les groupes
property.sonar.auth.gitlab.allowUsersToSignUp.description=Autoriser de nouveaux comptes à s\u2019authentifier. Une fois désactivé, seuls les comptes existants pourront s\u2019authentifier sur le serveur.
property.sonar.auth.gitlab.allowUsersToSignUp.name=Autoriser la création de comptes
property.sonar.auth.gitlab.allowedGroups.description=Seuls les membres de ces groupes (et sous-groupes) seront autorisés à s\u2019authentifier. Saisir l\u2019identifiant du groupe tel qu\u2019il apparaît dans l\u2019URL GitLab, par exemple « mon-groupe-gitlab ». Avec l\u2019approvisionnement automatique, seuls les membres de ces groupes (et sous-groupes) seront approvisionnés. Ignoré lorsque « Autoriser tous les groupes » est activé.
property.sonar.auth.gitlab.allowedGroups.name=Groupes autorisés
