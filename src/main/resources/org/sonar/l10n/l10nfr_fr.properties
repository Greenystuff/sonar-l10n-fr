property.sonar.scanner.skipNodeProvisioning.description=Détermine si le scanner doit renoncer à déployer l\u2019environnement Node.js embarqué pour employer celui de la machine. L\u2019analyse échouera si aucune version compatible de Node.js n\u2019est fournie par sonar.nodejs.executable ou par le PATH.
