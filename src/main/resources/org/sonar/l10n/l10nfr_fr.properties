property.sonar.secrets.demoMode.description=Une fois activé, tout fichier non binaire est analysé, les filtres qui écartent les faux secrets et les valeurs d\u2019exemple sont désactivés (active sonar.secrets.disableKnownFakeSecretFilter), les secrets à faible entropie sont signalés (active sonar.secrets.disableEntropyFilter), les fichiers de test détectés automatiquement sont analysés (active sonar.secrets.disableTestFileDetection), et aucun suffixe de fichier n\u2019est exclu de l\u2019analyse de secrets (vide sonar.secrets.excluded.file.suffixes). C\u2019est un raccourci vers tous ces réglages. Destiné aux démonstrations et aux évaluations : il relève des résultats connus pour être bruyants, et ne convient donc pas à une analyse de production.
property.sonar.secrets.demoMode.name=Activer le mode démonstration de la détection de secrets
property.sonar.secrets.disableEntropyFilter.description=Une fois activé, les correspondances à faible entropie, normalement écartées, sont signalées comme problèmes à faible confiance. De quoi faire ressortir de faux secrets ou des valeurs d\u2019exemple dans un projet de référence ou d\u2019évaluation. Les autres filtres restent inchangés.
property.sonar.secrets.disableEntropyFilter.name=Désactiver le filtre d\u2019entropie de la détection de secrets
property.sonar.secrets.disableKnownFakeSecretFilter.description=Une fois activé, les candidats figurant dans la liste d\u2019exclusion de faux secrets tenue par une règle \u2014 caractères répétés, jetons d\u2019espace réservé, valeurs d\u2019exemple de la documentation \u2014 sont signalés comme problèmes à faible confiance. De quoi faire ressortir de faux secrets ou des valeurs d\u2019exemple dans un projet de référence ou d\u2019évaluation. Les autres filtres restent inchangés.
property.sonar.secrets.disableKnownFakeSecretFilter.name=Désactiver le filtre de faux secrets connus de la détection de secrets
property.sonar.secrets.disableTestFileDetection.description=Une fois activé, les fichiers de test détectés automatiquement sont analysés et leurs résultats signalés comme problèmes à faible confiance. Ce réglage reste sans effet sur les fichiers explicitement classés comme tests par la propriété « sonar.tests ».
property.sonar.secrets.disableTestFileDetection.name=Désactiver la détection automatique des fichiers de test pour la détection de secrets
property.sonar.secrets.excluded.file.suffixes.description=Liste des suffixes de fichiers à ne pas soumettre à l\u2019analyse de secrets.
property.sonar.secrets.excluded.file.suffixes.name=Suffixes de fichiers exclus de l\u2019analyse de secrets
property.sonar.technicalDebt.developmentCost.description=Coût de développement d\u2019une ligne de code (LOC). Exemple : si le coût de développement d\u2019une ligne est estimé à 30 minutes, la valeur de cette propriété sera 30.
property.sonar.technicalDebt.developmentCost.name=Coût de développement
property.sonar.technicalDebt.ratingGrid.description=Les scores de maintenabilité vont de A (très bon) à E (très mauvais). Le score est déterminé par le ratio de dette technique, qui compare la dette technique d\u2019un projet au coût d\u2019une réécriture complète du code. Les valeurs par défaut de A à D sont 0.05,0.1,0.2,0.5. Au-delà de 0.5, le score est E. Exemple : en supposant un coût de développement de 30 minutes, un projet cumulant 24 000 minutes de dette technique pour 2 500 lignes de code aura un ratio de dette technique de 24000/(30 * 2500) = 0,32. Cela donne un score de maintenabilité D.
property.sonar.technicalDebt.ratingGrid.name=Grille du score de maintenabilité
property.sonar.terraform.activate.description=Désactiver l\u2019analyse Terraform garantit qu\u2019aucun fichier Terraform n\u2019est lu, coloré ni analysé, et qu\u2019aucun résultat d\u2019analyse IaC n\u2019entre dans la Barrière Qualité.
