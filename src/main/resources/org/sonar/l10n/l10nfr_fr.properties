property.sonar.cpd.cross_project.description=DÉPRÉCIÉ \u2014 par défaut, SonarQube détecte les duplications au niveau du projet : un bloc dupliqué entre deux projets différents n\u2019est donc pas signalé. Régler ce paramètre à « true » permet de détecter les duplications entre projets. Attention : activer cette propriété allonge nettement chaque analyse SonarQube, et dégrade donc le traitement des rapports à mesure que des projets rejoignent ce mécanisme.
property.sonar.cpd.cross_project.name=Détection de duplications entre projets
property.sonar.cpd.exclusions.description=Motifs utilisés pour exclure certains fichiers sources du mécanisme de détection de duplications. Voir ci-dessous comment employer des jokers pour renseigner cette propriété.
property.sonar.cpd.exclusions.name=Exclusions de la détection de duplications
property.sonar.cs.analyzeGeneratedCode.description=Réglé sur « true », les fichiers contenant du code généré sont analysés. Réglé sur « false », ils sont ignorés.
property.sonar.cs.analyzeGeneratedCode.name=Analyser le code généré
property.sonar.cs.analyzeRazorCode.description=Réglé sur « true », les fichiers .razor et .cshtml sont analysés intégralement, ce qui peut allonger l\u2019analyse. Réglé sur « false », les fichiers .cshtml ne sont analysés que pour les vulnérabilités d\u2019injection.
property.sonar.cs.analyzeRazorCode.name=Analyser le code Razor
property.sonar.cs.file.suffixes.description=Liste des suffixes des fichiers à analyser.
property.sonar.cs.file.suffixes.name=Suffixes de fichiers
property.sonar.cs.ignoreHeaderComments.description=Réglé sur « true », les en-têtes de fichier \u2014 souvent identiques partout, une mention de licence par exemple \u2014 ne comptent pas comme des commentaires, et une mesure telle que « Lignes de commentaires » ne s\u2019en trouve pas augmentée. Réglé sur « false », ces en-têtes comptent comme des commentaires et augmentent la mesure.
property.sonar.cs.ignoreHeaderComments.name=Ignorer les commentaires d\u2019en-tête
property.sonar.cs.roslyn.bugCategories.description=Catégories de règles externes à traiter comme des anomalies.
property.sonar.cs.roslyn.bugCategories.name=Catégories de règles rattachées aux anomalies
property.sonar.cs.roslyn.codeSmellCategories.description=Catégories de règles externes à traiter comme des mauvaises pratiques. Par défaut, les problèmes externes sont des mauvaises pratiques, ou des anomalies lorsque la sévérité vaut « error ».
