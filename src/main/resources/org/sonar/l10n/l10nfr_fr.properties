property.sonar.coverage.jacoco.aggregateXmlReportPaths.description=Chemins vers les fichiers de rapport de couverture agrégée JaCoCo au format XML. Chaque chemin peut être absolu ou relatif au répertoire de base du projet. Les jokers sont acceptés (*, ** et ?).
