property.sonar.auth.gitlab.enabled.name=Activé
property.sonar.auth.gitlab.groupsSync.description=Pour chaque groupe GitLab d\u2019appartenance, le compte sera associé à un groupe du même nom dans SonarQube, s\u2019il existe. Une fois activé, l\u2019application GitLab OAuth 2 devra fournir la portée api.
property.sonar.auth.gitlab.groupsSync.name=Synchroniser les groupes
