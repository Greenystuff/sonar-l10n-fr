#------------------------------------------------------------------------------
#
# French translation of the bundle shipped by the Clean as You Code plugin.
#
# DefaultI18n resolves every key through the bundle of the plugin that declared
# it, using a classloader shared by all plugins. Shipping cayc_fr.properties here
# is therefore enough for those keys to come out in French -- which is what a
# language pack is for, and what this one did for no plugin at all until now.
#
# Keys come from org/sonar/l10n/cayc.properties in sonar-cayc-plugin.
#
#------------------------------------------------------------------------------

