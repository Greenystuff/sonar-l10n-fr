#------------------------------------------------------------------------------
#
# French translation of the bundle shipped by the PHP analyzer.
#
# Same mechanism as cayc_fr.properties: DefaultI18n resolves every key through
# the bundle of the plugin that declared it, over a classloader shared by all
# plugins, so shipping php_fr.properties here is enough for those keys to come
# out in French.
#
# These are the labels of the rule parameters, shown in the rule panel of the
# Quality Profile screens. They were the last keys a language pack could still
# reach and this one did not.
#
# Keys come from org/sonar/l10n/php.properties in sonar-php-plugin.
#
#------------------------------------------------------------------------------

rule.php.S100.param.format=Expression régulière à laquelle confronter les noms de fonctions
rule.php.S101.param.format=Expression régulière à laquelle confronter les noms de classes.
rule.php.S103.param.maximumLineLength=Longueur de ligne maximale autorisée.
rule.php.S104.param.max=Nombre de lignes maximal autorisé dans un fichier.
rule.php.S1067.param.max=Nombre maximal d\u2019opérateurs conditionnels autorisés dans une expression
rule.php.S107.param.max=Nombre de paramètres maximal autorisé
rule.php.S1142.param.max=Nombre maximal d\u2019instructions de retour autorisées par fonction
rule.php.S115.param.format=Expression régulière à laquelle confronter les noms de constantes.
rule.php.S1151.param.max=Nombre maximal de lignes
rule.php.S116.param.format=Expression régulière à laquelle confronter les noms d\u2019attributs.
rule.php.S117.param.format=Expression régulière à laquelle confronter les noms.
rule.php.S1192.param.threshold=Nombre de répétitions d\u2019un littéral à partir duquel signaler un problème
rule.php.S1200.param.max=Nombre maximal de classes dont une seule classe peut dépendre
rule.php.S1311.param.max=Complexité maximale autorisée.
rule.php.S134.param.max=Profondeur d\u2019imbrication maximale autorisée pour les structures de contrôle.
rule.php.S138.param.max=Nombre de lignes maximal autorisé dans une fonction
rule.php.S139.param.legalTrailingCommentPattern=Motif du texte des commentaires de fin de ligne autorisés. Par défaut, les commentaires d\u2019un seul mot.
rule.php.S1448.param.countNonpublicMethods=Compter ou non les méthodes non publiques
rule.php.S1448.param.maximumMethodThreshold=Nombre maximal de méthodes
rule.php.S1451.param.headerFormat=En-tête de licence et de propriété intellectuelle attendu (texte brut)
rule.php.S1479.param.max=Nombre maximal de cas
rule.php.S1541.param.threshold=Complexité maximale autorisée.
rule.php.S1808.param.closing_curly_brace=L\u2019accolade fermante et les mots-clés « else », « catch » et « finally » qui suivent doivent tenir sur la même ligne
rule.php.S1808.param.closure_format=La déclaration des fermetures doit être correctement espacée
rule.php.S1808.param.extends_implements_line=Les noms de classes et les mots-clés « extends » et « implements » doivent tenir sur la même ligne
rule.php.S1808.param.foreach_space=Dans une instruction foreach, il doit y avoir une espace avant et après le mot-clé « as » et l\u2019opérateur « => »
rule.php.S1808.param.function_calls_arguments_indentation=Les arguments des appels de méthode ou de fonction doivent être correctement indentés
rule.php.S1808.param.function_declaration_arguments_indentation=Les arguments des déclarations de méthode ou de fonction doivent être correctement indentés
rule.php.S1808.param.interfaces_indentation=La liste des interfaces implémentées doit être correctement indentée
rule.php.S1808.param.namespace_blank_line=Les déclarations « namespace » doivent être suivies d\u2019une ligne vide
rule.php.S1808.param.no_space=Il ne doit y avoir aucune espace après la parenthèse ouvrante ni avant la parenthèse fermante
rule.php.S1808.param.no_space_method_name=Il ne doit y avoir aucune espace après un nom de méthode
rule.php.S1808.param.one_space_after=Il doit y avoir exactement une espace entre la parenthèse fermante et l\u2019accolade ouvrante
rule.php.S1808.param.one_space_before=Il doit y avoir exactement une espace entre le mot-clé d\u2019une structure de contrôle et la parenthèse ou l\u2019accolade ouvrante
rule.php.S1808.param.one_space_for=Il doit y avoir une espace après chaque « ; » dans une instruction « for »
rule.php.S1808.param.open_curly_brace_classes_functions=Les accolades ouvrantes doivent être en début de nouvelle ligne pour les classes et les fonctions
rule.php.S1808.param.open_curly_brace_control_structures=Les accolades ouvrantes doivent être en fin de ligne pour les structures de contrôle
rule.php.S1808.param.space_comma=Les virgules doivent être suivies d\u2019une espace et précédées d\u2019aucune
rule.php.S1808.param.use_after_namespace=Les déclarations « use » doivent être placées après les déclarations « namespace »
rule.php.S1808.param.use_blank_line=Les déclarations « use » doivent être suivies d\u2019une ligne vide
